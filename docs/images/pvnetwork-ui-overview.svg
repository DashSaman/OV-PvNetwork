    <rect x="320" y="165" width="270" height="140" rx="18" fill="#16284f" stroke="#5147a8"/><text x="455" y="220" fill="#fff" font-size="24">Health</text><text x="455" y="258" fill="#b7b0ff" font-size="18">CPU · RAM · uptime</text>
