<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="#081321"/><text x="55" y="60" fill="#fff" font-size="30" font-family="Arial">Nodes / Fleet — sanitized reference</text>
<rect x="55" y="95" width="1090" height="95" rx="16" fill="#0f2035" stroke="#294a6d"/><text x="80" y="135" fill="#9edcff" font-size="18" font-family="Arial">1 Add Node · 2 Automatic SSH Deploy · 3 Search / status filters · 4 Fleet operations</text><text x="80" y="165" fill="#dbeafa" font-size="16" font-family="Arial">SSH credentials stay in the live request flow and must never be committed to the public repository.</text>
<g font-family="Arial"><rect x="55" y="225" width="335" height="225" rx="16" fill="#10273a" stroke="#2e7795"/><text x="80" y="265" fill="#fff" font-size="23">Node A</text><text x="80" y="305" fill="#99dfff" font-size="17">Health 98 · Online</text><text x="80" y="340" fill="#d5e5f5" font-size="16">CPU 18% · RAM 31%</text><text x="80" y="375" fill="#d5e5f5" font-size="16">Uptime · RX/TX · sessions</text><text x="80" y="415" fill="#ffc78e" font-size="16">Drain · Maintenance · Weight</text>
<rect x="425" y="225" width="335" height="225" rx="16" fill="#142544" stroke="#6657ae"/><text x="450" y="265" fill="#fff" font-size="23">Node B</text><text x="450" y="305" fill="#c4bdff" font-size="17">Health 86 · Degraded</text><text x="450" y="340" fill="#d5e5f5" font-size="16">CPU · RAM · network</text><text x="450" y="375" fill="#d5e5f5" font-size="16">Assigned users · version</text><text x="450" y="415" fill="#ffc78e" font-size="16">Retry · Canary · Rollback</text>
<rect x="795" y="225" width="350" height="225" rx="16" fill="#2f2421" stroke="#a8643e"/><text x="820" y="265" fill="#fff" font-size="23">5 Auto Deploy Console</text><text x="820" y="305" fill="#ffd2ae" font-size="16">preflight → install → patch</text><text x="820" y="340" fill="#ffd2ae" font-size="16">service → firewall scope</text><text x="820" y="375" fill="#ffd2ae" font-size="16">profile test → health verify</text><text x="820" y="415" fill="#fff" font-size="16">No global firewall flush.</text></g>
<rect x="55" y="490" width="1090" height="170" rx="16" fill="#0e1c2e" stroke="#294a6d"/><g font-family="Arial" font-size="17" fill="#d8e7f6"><text x="80" y="535">6 Rebalance: move assignments according to health/control state.</text><text x="80" y="575">7 Drain: stop new placement while preserving controlled service.</text><text x="80" y="615">8 Maintenance: exclude node from normal operations until resumed.</text><text x="635" y="535">9 Canary: staged node update.</text><text x="635" y="575">10 Rollback: revert failed staged update.</text><text x="635" y="615">11 Metrics: CPU · RAM · uptime · traffic · sessions.</text></g>
</svg>