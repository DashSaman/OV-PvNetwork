<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="#081321"/><text x="55" y="60" fill="#fff" font-size="30" font-family="Arial">Security / Operations / Monitoring — sanitized reference</text>
<g font-family="Arial"><rect x="55" y="100" width="330" height="245" rx="16" fill="#10263a" stroke="#34769b"/><text x="80" y="145" fill="#a6e1ff" font-size="23">1 Security</text><text x="80" y="190" fill="#fff" font-size="17">TOTP / 2FA</text><text x="80" y="225" fill="#fff" font-size="17">API tokens + scopes</text><text x="80" y="260" fill="#fff" font-size="17">Rate limit</text><text x="80" y="295" fill="#fff" font-size="17">IP allow-list</text><text x="80" y="325" fill="#ffc690" font-size="15">Revoke/rotate exposed secrets.</text>
<rect x="435" y="100" width="330" height="245" rx="16" fill="#16352f" stroke="#3a8b75"/><text x="460" y="145" fill="#aaf0d4" font-size="23">2 Operations</text><text x="460" y="190" fill="#fff" font-size="17">Audit log</text><text x="460" y="225" fill="#fff" font-size="17">Bulk user actions</text><text x="460" y="260" fill="#fff" font-size="17">Rebalance / jobs</text><text x="460" y="295" fill="#fff" font-size="17">Backup / restore</text><text x="460" y="325" fill="#d9fff0" font-size="15">Every mutation should be attributable.</text>
<rect x="815" y="100" width="330" height="245" rx="16" fill="#302746" stroke="#7660ad"/><text x="840" y="145" fill="#d3c6ff" font-size="23">3 Monitoring</text><text x="840" y="190" fill="#fff" font-size="17">CPU / RAM / disk</text><text x="840" y="225" fill="#fff" font-size="17">SSL / node health</text><text x="840" y="260" fill="#fff" font-size="17">Telegram alert hooks</text><text x="840" y="295" fill="#fff" font-size="17">Usage / domain activity</text><text x="840" y="325" fill="#eadfff" font-size="15">Metrics failures must fail safe.</text></g>
<rect x="55" y="395" width="1090" height="255" rx="16" fill="#0e1c2e" stroke="#294a6d"/><g font-family="Arial" font-size="17" fill="#d7e6f5"><text x="80" y="445">4 Bandwidth Control: all users · owner/reseller · group · selected users; preview before apply.</text><text x="80" y="490">5 Emergency policy: upload/download limits, duration, canary and fail-open handling.</text><text x="80" y="535">6 Backup/Restore: create verified restore points before risky changes.</text><text x="80" y="580">7 Domain Activity: per-user / per-node observed DNS activity, search and history.</text><text x="80" y="625">8 Audit: actor · resource · status · request ID · duration · source metadata.</text></g>
</svg>