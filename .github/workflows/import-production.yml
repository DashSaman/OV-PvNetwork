name: Import sanitized production source

on:
  push:
    branches:
      - stable-v1.0.0
    paths:
      - '.bootstrap/COMPLETE'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconstruct audited source archive
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .bootstrap/source.part*.b64 | base64 -d > /tmp/ov-pvnetwork-production.tar.gz
          echo '4700daf1281c920674da80be121c450fb8aa1d63948670f907777f6669214d35  /tmp/ov-pvnetwork-production.tar.gz' | sha256sum -c -

      - name: Import application and system files
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf app system SOURCE-MANIFEST.json
          tar -xzf /tmp/ov-pvnetwork-production.tar.gz -C .
          test -f app/backend/app.py
          test -f app/frontend/package.json
          test -f system/ov-node-user-reconcile.py
          rm -rf .bootstrap

      - name: Commit production source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A app system SOURCE-MANIFEST.json .bootstrap
          git commit -m 'stable: import audited sanitized production source'
          git push origin HEAD:stable-v1.0.0
