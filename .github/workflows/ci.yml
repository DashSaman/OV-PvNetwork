name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  URLPATH: panel
  VITE_URLPATH: panel
  ADMIN_USERNAME: ci-admin
  ADMIN_PASSWORD_HASH: ci-not-a-production-hash
  JWT_SECRET_KEY: ci-jwt-secret-key-not-production-32chars

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install backend test dependencies
        run: |
          python - <<'PYDEPS'
          import subprocess, sys, tomllib
          with open('pyproject.toml', 'rb') as handle:
              deps = tomllib.load(handle)['project']['dependencies']
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *deps])
          PYDEPS

      - name: Backend dependency and static security audit
        run: |
          python -m pip install --disable-pip-version-check pip-audit bandit
          python - <<'PYSEC'
          import tomllib
          with open('pyproject.toml', 'rb') as handle:
              deps = tomllib.load(handle)['project']['dependencies']
          with open('/tmp/pvnetwork-audit-requirements.txt', 'w') as handle:
              handle.write('\n'.join(deps) + '\n')
          PYSEC
          pip-audit -r /tmp/pvnetwork-audit-requirements.txt
          bandit -q -r backend -ll -x backend/alembic/versions

      - name: Bash syntax
        run: |
          set -e
          for f in install.sh install-local.sh scripts/*.sh scripts/pvnetwork-build-client-profile scripts/pvnetwork-panel-backup scripts/pvnetwork-panel-restore-job scripts/pvnetwork-panel-smoke-test scripts/pvnetwork-firewall-hardening scripts/pvnetwork-firewall-boot scripts/pvnetwork-router-openvpn; do
            [ -f "$f" ] && bash -n "$f"
          done

      - name: Python syntax
        run: |
          python3 -m compileall -q backend tests
          python3 -m py_compile scripts/*.py

      - name: Unit and governance tests
        run: python3 -m unittest discover -s tests -v

      - name: Router OpenVPN safety contracts
        run: |
          python3 -m unittest \
            tests.test_router_openvpn_schema \
            tests.test_router_openvpn_credentials \
            tests.test_router_openvpn_node_contract \
            tests.test_router_openvpn_node_helper \
            tests.test_router_openvpn_handshake \
            tests.test_router_openvpn_api \
            tests.test_router_openvpn_user_lifecycle \
            tests.test_router_openvpn_presence -v

      - name: Frontend production build
        working-directory: frontend
        run: |
          npm ci
          npm run lint -- --quiet
          npm run build

      - name: Frontend runtime audit and bundle budget
        working-directory: frontend
        run: |
          npm audit --omit=dev --audit-level=high
          MAX_JS=$(find dist/assets -type f -name '*.js' -printf '%s\n' | sort -nr | head -1)
          test -n "$MAX_JS"
          echo "LARGEST_JS_BYTES=$MAX_JS"
          test "$MAX_JS" -le 768000

      - name: Browser responsive smoke matrix
        working-directory: frontend
        env:
          PV_UI_BASE_URL: http://127.0.0.1:4173/panel
        run: |
          python3 -m pip install --disable-pip-version-check jinja2
          npx playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/pvnetwork-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/panel/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/panel/ >/dev/null
          node tests/online-user-truth-smoke.mjs
          node tests/responsive-smoke.mjs
          node tests/inline-quick-edit-smoke.mjs
          node tests/user-create-node-selector-smoke.mjs
          node tests/router-openvpn-smoke.mjs
          PV_PYTHON=python3 node tests/subscription-responsive-smoke.mjs

      - name: JSON syntax
        run: |
          python3 -m json.tool manifest.json >/dev/null
          for f in frontend/src/lang/*.json; do python3 -m json.tool "$f" >/dev/null; done

      - name: Basic secret and private-material guard
        run: |
          set -e
          if git ls-files | grep -Ei '\.(ovpn|p12|pfx|key|pem|db|sqlite|sqlite3)$'; then
            echo 'Forbidden tracked private material detected.' >&2
            exit 1
          fi
          ! grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude='.env.example' \
            --exclude='ci.yml' \
            '(^|[^A-Z_])(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ADMIN_PASSWORD=[^$<]|JWT_SECRET_KEY=[^$<])' .

      - name: Governance files present
        run: |
          test -s AGENTS.md
          test -s docs/QA-RELEASE-GATE.md
          test -s docs/COMPETITOR-GAP-MATRIX.md
          test -s docs/UX-AUDIT.md
          test -s design-system/pvnetwork/MASTER.md

      - name: Installer bootstrap and lifecycle references
        run: |
          grep -q 'install-local.sh' install.sh
          grep -q 'pvnetwork update' README.md
          grep -q 'pvnetwork update' README.fa.md
