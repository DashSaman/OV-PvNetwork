name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bash syntax
        run: |
          set -e
          for f in install.sh install-local.sh scripts/*.sh scripts/ov-build-client-profile; do
            [ -f "$f" ] && bash -n "$f"
          done

      - name: Python syntax
        run: |
          python3 -m compileall -q backend tests
          python3 -m py_compile scripts/*.py

      - name: Unit and governance tests
        run: python3 -m unittest discover -s tests -v

      - name: Frontend production build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: JSON syntax
        run: |
          python3 -m json.tool manifest.json >/dev/null
          for f in frontend/src/lang/*.json; do python3 -m json.tool "$f" >/dev/null; done

      - name: Basic secret and private-material guard
        run: |
          set -e
          if git ls-files | grep -Ei '\.(ovpn|p12|pfx|key|pem|db|sqlite|sqlite3)$'; then
            echo 'Forbidden tracked private material detected.' >&2
            exit 1
          fi
          ! grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude='.env.example' \
            --exclude='ci.yml' \
            '(^|[^A-Z_])(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ADMIN_PASSWORD=[^$<]|JWT_SECRET_KEY=[^$<])' .

      - name: Governance files present
        run: |
          test -s AGENTS.md
          test -s docs/QA-RELEASE-GATE.md
          test -s docs/COMPETITOR-GAP-MATRIX.md
          test -s docs/UX-AUDIT.md
          test -s design-system/pvnetwork/MASTER.md

      - name: Installer references manager
        run: |
          grep -q 'scripts/manage.sh' install.sh
          grep -q 'ovpv update' README.md
          grep -q 'ovpv update' README.fa.md
